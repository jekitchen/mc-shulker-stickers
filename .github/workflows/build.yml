name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Runs core unit tests, Fabric GameTests and Paper MockBukkit tests.
      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: shulker-stickers-jars
          path: |
            fabric/build/libs/*.jar
            paper/build/libs/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/

  # The Fabric release jar on a real dedicated server with only Fabric API installed.
  fabric-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Smoke test the Fabric jar
        run: scripts/fabric-smoke.sh

      - name: Showcase datapack loads and builds
        run: scripts/showcase-check.sh

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fabric-smoke-log
          path: build/fabric-smoke/server.log
          if-no-files-found: ignore

  # A world moved from a real Fabric server to Paper and back (AC-13).
  world-move:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Move a world between Fabric and Paper
        run: scripts/world-move.sh

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-move-logs
          path: build/world-move/*.log
          if-no-files-found: ignore

  # The Paper plugin's built-in checks on real servers (Paper, Folia, Canvas, and Paper with
  # real WorldGuard and GriefPrevention). Each server starts, runs the checks and stops.
  selftest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        task: [runServer, runFolia, runCanvas, runClaims]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # On Paper this also restarts the self-test's world without the plugin (AC-6).
      - name: Self-test on ${{ matrix.task }}
        run: |
          if [ "${{ matrix.task }}" = runServer ]; then
            scripts/paper-uninstall.sh
          else
            scripts/selftest.sh ${{ matrix.task }}
          fi

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selftest-${{ matrix.task }}
          path: build/selftest/
          if-no-files-found: ignore
