name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Runs core unit tests, Fabric GameTests and Paper MockBukkit tests.
      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: shulker-stickers-jars
          path: |
            fabric/build/libs/*.jar
            paper/build/libs/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
