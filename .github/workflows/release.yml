name: Release

# Pushing a tag such as v0.1.0-alpha.1 builds and tests that commit, then creates a DRAFT
# GitHub release with both jars attached. Nothing is public until the draft is published by
# hand. Modrinth and Hangar uploads are manual (see docs/release/README.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches mod_version
        id: version
        run: |
          version="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2-)"
          mc="$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2-)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match mod_version ${version} (expected v${version})"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "mc=${mc}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Smoke test the Fabric jar
        run: scripts/fabric-smoke.sh

      - name: Self-test on Paper, Folia and Canvas
        run: |
          scripts/paper-uninstall.sh
          scripts/selftest.sh runFolia
          scripts/selftest.sh runCanvas

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The section under "## <version>", up to the next "## " heading.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > build/release-notes.md
          if [ ! -s build/release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          MC: ${{ steps.version.outputs.mc }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" --draft $prerelease \
            --title "Shulker Stickers ${VERSION} for Minecraft ${MC}" \
            --notes-file build/release-notes.md \
            fabric/build/libs/shulker-stickers-fabric-${VERSION}+${MC}.jar \
            paper/build/libs/shulker-stickers-paper-${VERSION}+${MC}.jar
